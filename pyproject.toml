[project]
name = "end-to-end-ml-microservice"
version = "1.0.0"
description = "From a raw public dataset to a deployed ML microservice: MLflow experiments, a promoted model and a FastAPI service in Docker."
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trip-duration = "trip_duration.cli:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The importable package is trip_duration (src/trip_duration).
module-name = "trip_duration"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The API package (app/) sits at the repo root next to src/.
pythonpath = ["."]
markers = [
    "integration: needs the MLflow server with a promoted model (docker compose up -d mlflow)",
]

[tool.ruff]
# ./mlflow holds the tracking server's data, not code.
extend-exclude = ["mlflow", "data"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.ruff.lint.isort]
# Without this, the ./mlflow data folder makes ruff treat mlflow as project code.
known-third-party = ["mlflow"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
